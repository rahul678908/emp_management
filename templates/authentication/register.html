{% extends 'base.html' %}
{% block title %}Register - EMS{% endblock %}
{% block auth_content %}
<div style="min-height:100vh;background:linear-gradient(135deg,#1e1b4b,#312e81);display:flex;align-items:center;justify-content:center;padding:2rem 1rem;">
    <div style="width:100%;max-width:480px;">
        <div class="card p-4">
            <div class="text-center mb-4">
                <div style="width:56px;height:56px;background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;">
                    <i class="fas fa-user-plus text-white fa-lg"></i>
                </div>
                <h4 class="fw-bold">Create Account</h4>
            </div>
            {% for message in messages %}
            <div class="alert alert-danger">{{ message }}</div>
            {% endfor %}
            <form method="post">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-6">
                        <label class="form-label fw-semibold">First Name</label>
                        <input type="text" name="first_name" class="form-control" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-semibold">Last Name</label>
                        <input type="text" name="last_name" class="form-control" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password1" class="form-control" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-semibold">Confirm</label>
                        <input type="password" name="password2" class="form-control" required>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary w-100">Create Account</button>
                    </div>
                </div>
            </form>
            <p class="text-center mt-3 mb-0 small text-muted">
                Already have an account? <a href="{% url 'authentication:login' %}">Sign in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
